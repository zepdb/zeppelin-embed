[package]
name = "zeppelin-embed-workspace-tests"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[test]]
name = "scaffold_gates"
path = "scaffold_gates.rs"

[[test]]
name = "adversarial_tests"
path = "adversarial_tests.rs"

[[test]]
name = "adversarial_cli"
path = "adversarial_cli.rs"

[[test]]
name = "graph_refinement"
path = "graph_refinement.rs"

[dependencies]
proptest.workspace = true
rand.workspace = true
rand_chacha.workspace = true
tempfile.workspace = true
zeppelin-embed-adversarial-oracle = { path = "adversarial-oracle", version = "=0.1.0" }
zeppelin-embed = { path = "../crates/zeppelin-embed", version = "=0.1.0", features = ["test-support"] }
zeppelin-embed-bench = { path = "../crates/zeppelin-embed-bench", version = "=0.1.0" }
zeppelin-embed-ffi = { path = "../crates/zeppelin-embed-ffi", version = "=0.1.0", features = ["abi-panic-probe"] }
