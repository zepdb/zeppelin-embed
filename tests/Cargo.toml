[package]
name = "zeppelin-embed-workspace-tests"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[[test]]
name = "scaffold_gates"
path = "scaffold_gates.rs"

[[test]]
name = "adversarial_tests"
path = "adversarial_tests.rs"

[[test]]
name = "adversarial_cli"
path = "adversarial_cli.rs"

[[test]]
name = "graph_refinement"
path = "graph_refinement.rs"

[features]
# Opt-in internal graph component campaigns; default artifacts stay unchanged.
graph-cypher = [
    "dep:zeppelin-embed-cypher",
    "zeppelin-embed/graph-cypher",
    "zeppelin-embed-ffi/graph-cypher",
]
# Scoped allocation scheduling for PG16 qualification only.
graph-result-test-support = [
    "graph-cypher",
    "zeppelin-embed-ffi/graph-result-test-support",
]

[dependencies]
proptest.workspace = true
rand.workspace = true
rand_chacha.workspace = true
tempfile.workspace = true
zeppelin-embed-adversarial-oracle = { path = "adversarial-oracle", version = "=0.5.0" }
zeppelin-embed = { path = "../crates/zeppelin-embed", version = "=0.5.0", features = ["test-support"] }
zeppelin-embed-bench = { path = "../crates/zeppelin-embed-bench", version = "=0.5.0" }
zeppelin-embed-ffi = { path = "../crates/zeppelin-embed-ffi", version = "=0.5.0", features = ["abi-panic-probe"] }

zeppelin-embed-cypher = { path = "../crates/zeppelin-embed-cypher", version = "=0.5.0", optional = true }

[[test]]
name = "graph_fixture"
path = "graph_fixture.rs"
required-features = ["graph-cypher"]

[[bin]]
name = "graph-fixture"
path = "graph_fixture_cli.rs"
required-features = ["graph-cypher"]

[[test]]
name = "graph_search_qualification"
path = "graph_search_qualification.rs"
required-features = ["graph-cypher"]
