[package]
name = "zeppelin-embed-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[features]
graph-cypher = [
    "dep:zeppelin-embed-cypher",
    "zeppelin-embed/graph-cypher",
]

[dependencies]
zeppelin-embed-cypher = { path = "../crates/zeppelin-embed-cypher", optional = true }
libfuzzer-sys = "0.4.13"
rand = "0.9.5"
rand_chacha = "0.9.0"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
zeppelin-embed = { path = "../crates/zeppelin-embed", features = ["test-support"] }
zeppelin-embed-ffi = { path = "../crates/zeppelin-embed-ffi" }

[workspace]
members = ["."]

[[bin]]
name = "fuzz_smoke"
path = "fuzz_targets/fuzz_smoke.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kernels_equivalence"
path = "fuzz_targets/kernels_equivalence.rs"
test = false
doc = false
bench = false

