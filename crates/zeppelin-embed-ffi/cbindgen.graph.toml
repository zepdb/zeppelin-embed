# Graph data contracts and implemented opt-in graph entry points.
language = "C"
include_guard = "ZEPPELIN_GRAPH_CONTRACTS_H"
cpp_compat = true
documentation = true
documentation_style = "c"
style = "both"
no_includes = true
includes = ["zeppelin_embed.h"]
usize_is_size_t = true
tab_width = 4
line_length = 80

[export]
include = [
    "ze_graph_open",
    "ze_graph_close",
    "ze_graph_apply",
    "ze_graph_response_free",
    "ze_graph_cypher",
    "ze_graph_cypher_with_row_limit",
    "ze_graph_open_with_relationship_types",
    "ze_graph_set_maintenance_policy",
    "ze_graph_maintain",
    "ze_graph_get_nodes",
    "ze_graph_get_relationships",
    "ze_graph_query",

    "ZeNodeId",
    "ZeRelId",
    "ZeGraphHandle",
    "ZeGraphResources",
    "ZeGraphRange",
    "ZeGraphValueTag",
    "ZeGraphListKind",
    "ZeGraphValue",
    "ZeGraphEntityKind",
    "ZeGraphEndpointKind",
    "ZeGraphBatchOperation",
    "ZeGraphBytes",
    "ZeGraphControl",
    "ZeGraphProperty",
    "ZeGraphNode",
    "ZeGraphRelationship",
    "ZeGraphValuePool",
    "ZeGraphEndpoint",
    "ZeGraphBatchItem",
    "ZeGraphBatchRequest",
    "ZeGraphOptionalIndex",
    "ZeGraphExpressionKind",
    "ZeGraphUnaryOperation",
    "ZeGraphBinaryOperation",
    "ZeGraphAggregateOperation",
    "ZeGraphExpression",
    "ZeGraphProjection",
    "ZeGraphSortKey",
    "ZeGraphParameter",
    "ZeGraphParameterValue",
    "ZeGraphTier",
    "ZeGraphSearchKind",
    "ZeGraphSearchOptions",
    "ZeGraphSearch",
    "ZeGraphOperatorKind",
    "ZeGraphOperator",
    "ZeGraphMutationKind",
    "ZeGraphMutation",
    "ZeGraphPlan",
    "ZeGraphQueryOptions",
    "ZeGraphQueryRequest",
    "ZeGraphOpenMode",
    "ZeGraphOpenRequest",
    "ZeGraphRelationshipType",
    "ZeGraphCypherRequest",
    "ZeGraphGetNodesRequest",
    "ZeGraphGetRelsRequest",
    "ZeGraphDisposition",
    "ZeGraphReceipt",
    "ZeGraphColumn",
    "ZeGraphDiagnostic",
    "ZeGraphScorePrecision",
    "ZeGraphCandidateCoverage",
    "ZeGraphLegState",
    "ZeGraphWorkKind",
    "ZeGraphWorkCounter",
    "ZeGraphSearchReport",
    "ZeGraphResponse",
    "ZeGraphWorkLimit",
    "ZeGraphQueryLimits",
    "ZeGraphCompileLimits",
]

[parse]
parse_deps = false

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = false

[export.rename]
"ZeErrorCode" = "ze_error_code"

[fn]
args = "auto"
