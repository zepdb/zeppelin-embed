[package]
name = "zeppelin-embed-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
graph-cypher = ["zeppelin-embed/graph-cypher", "dep:zeppelin-embed-cypher"]
# Scoped allocation-site scheduling for the opt-in canonical test runner only.
graph-result-test-support = ["graph-cypher"]
abi-panic-probe = ["zeppelin-embed/test-support"]
text = ["dep:zeppelin-embed-text"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dependencies]
zeppelin-embed = { path = "../zeppelin-embed", version = "=0.5.0" }
zeppelin-embed-cypher = { path = "../zeppelin-embed-cypher", version = "=0.5.0", optional = true }
zeppelin-embed-text = { path = "../zeppelin-embed-text", version = "=0.5.0", optional = true }

# loom is compiled only under `--cfg loom`, the model-checking build of the
# handle state machine (task 22 phase 3). It never enters a default build.
[target.'cfg(loom)'.dependencies]
loom = "=0.7.2"

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "ffi_graph_contract"
required-features = ["graph-cypher"]

[[test]]
name = "ffi_graph_header"
required-features = ["graph-cypher"]

[[test]]
name = "ffi_graph_layout"
required-features = ["graph-cypher"]

[[test]]
name = "ffi_graph_entry"
required-features = ["graph-cypher"]

[[test]]
name = "ffi_graph_poison"
required-features = ["graph-cypher", "abi-panic-probe"]

[[test]]
name = "ffi_graph_ownership"
required-features = ["graph-cypher"]

[[test]]
name = "ffi_graph_full"
required-features = ["graph-cypher"]
