[package]
name = "zeppelin-embed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "In-process vector, lexical, and hybrid search for macOS and Apple silicon"
repository = "https://github.com/zepdb/zeppelin-embed"
homepage = "https://github.com/zepdb/zeppelin-embed"
documentation = "https://docs.rs/zeppelin-embed"
readme = "README.md"
keywords = ["vector-search", "full-text-search", "hybrid-search", "embedded", "macos"]
categories = ["database-implementations", "text-processing"]

[lib]
crate-type = ["rlib", "staticlib"]

[features]
graph-cypher = []
query-timing = []
allocation-audit = []
test-support = []

[dependencies]
libc.workspace = true
roaring.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
# BL-072: the crate's own integration tests need `test-support` so they can
# enumerate KernelVariant::available(); a plain `cargo test -p zeppelin-embed`
# does not otherwise enable a feature of the crate under test.
zeppelin-embed = { path = ".", features = ["test-support"] }
criterion.workspace = true
proptest.workspace = true
rand.workspace = true
rand_chacha.workspace = true
tempfile.workspace = true

[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "kernels_cold_dram"
harness = false

[[bench]]
name = "scan"
harness = false

[[bench]]
name = "query_pool"
harness = false

[[bench]]
name = "lexical_queries"
harness = false

[[bench]]
name = "ingest"
harness = false

[[bench]]
name = "filtered_exec"
harness = false

