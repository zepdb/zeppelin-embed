[package]
name = "zeppelin-embed-cypher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Bounded internal Cypher syntax frontend for Zeppelin Embed"

[dependencies]
zeppelin-embed = { path = "../zeppelin-embed", version = "=0.7.0", features = ["graph-cypher"] }

[dev-dependencies]
# Tests create and reopen native graph stores through test-only helpers.
zeppelin-embed = { path = "../zeppelin-embed", version = "=0.7.0", features = ["graph-cypher", "test-seams"] }
