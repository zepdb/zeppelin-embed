[package]
name = "zeppelin-embed-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
test-support = ["zeppelin-embed/test-support"]

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
zeppelin-embed = { path = "../zeppelin-embed", version = "=0.3.0" }
libc.workspace = true
xxhash-rust.workspace = true
mlx-rs = { version = "=0.25.3", default-features = false, features = ["metal"] }
unicode-normalization-alignments = "=0.1.12"
unicode_categories = "=0.1.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile.workspace = true
