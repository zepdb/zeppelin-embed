[package]
name = "zeppelin-embed-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
query-timing = ["zeppelin-embed/query-timing"]
text = ["dep:zeppelin-embed-text"]

[dependencies]
libc.workspace = true
serde_json.workspace = true
tempfile.workspace = true
zeppelin-embed = { path = "../zeppelin-embed", version = "=0.1.0", features = ["test-support"] }
zeppelin-embed-text = { path = "../zeppelin-embed-text", version = "=0.1.0", optional = true }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "scaffold"
harness = false

[[bin]]
name = "wal-throughput"
path = "src/bin/wal-throughput.rs"

[[bin]]
name = "text-user-bench"
path = "src/bin/text-user-bench.rs"
required-features = ["text"]
