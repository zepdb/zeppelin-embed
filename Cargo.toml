[workspace]
members = [
    "crates/zeppelin-embed",
    "crates/zeppelin-embed-text",
    "crates/zeppelin-embed-ffi",
    "crates/zeppelin-embed-bench",
    "tests/adversarial-oracle",
    "tests",
]
exclude = ["fuzz", "tools/fuzz-dispatch", "tools/size-consumer"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"

[workspace.dependencies]
libc = "=0.2.189"
roaring = "=0.10.12"
xxhash-rust = { version = "=0.8.18", features = ["xxh3"] }

proptest = "=1.10.0"
criterion = { version = "=0.5.1", default-features = false }
rand = "=0.9.5"
rand_chacha = "=0.9.0"
tempfile = "=3.25.0"
serde_json = "=1.0.151"

[profile.release]
# Owner decision O6, taken 2026-08-24: we ship speed, not size.
#
# `opt-level = "z"` cost the lexical query path 1.65x on TREC-COVID and
# 1.33x on FiQA against tantivy -- the difference between winning three of
# four BEIR corpora and winning two. Level 3 costs a measured +128 KB of
# linked sections against a 5,120 KB budget with roughly 3,200 KB spare.
#
# The standing rule for this repository is best-and-fastest, not smallest.
# Revisit only if the static-library gate in scripts/size-budget.sh comes
# under real pressure.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.bench]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1
strip = "none"
