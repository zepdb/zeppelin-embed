name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy supported workspace targets
        run: |
          workspace=(--workspace)
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            workspace+=(--exclude zeppelin-embed-text --exclude zeppelin-embed-bench)
          fi
          cargo clippy "${workspace[@]}" --all-targets -- -D warnings

  doc:
    name: doc (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Document supported workspace targets
        run: |
          workspace=(--workspace)
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            workspace+=(--exclude zeppelin-embed-text --exclude zeppelin-embed-bench)
          fi
          RUSTDOCFLAGS="-D warnings" cargo doc "${workspace[@]}" --no-deps

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cbindgen@0.29.4
      - name: Test supported workspace targets
        run: |
          workspace=(--workspace)
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            workspace+=(--exclude zeppelin-embed-text --exclude zeppelin-embed-bench)
          fi
          cargo test "${workspace[@]}"
      - name: Exercise every runtime kernel arm
        run: PROPTEST_CASES=1024 cargo test -p zeppelin-embed kernels
      - name: Require AVX2 execution on Ubuntu
        if: runner.os == 'Linux'
        run: >-
          ZE_REQUIRE_AVX2=1 cargo test -p zeppelin-embed --test kernels
          kernels::x86_runtime_executes_avx2_when_host_supports_it -- --exact

  coverage-gate:
    name: coverage-gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Enforce supported workspace coverage
        run: scripts/coverage.sh

  deny:
    name: deny (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
      - name: Prove the deny policy rejects Tokio
        run: >-
          cargo test -p zeppelin-embed-workspace-tests
          --test scaffold_gates deny_blacklist_rejects_banned_dep
          -- --ignored --exact

  size-budget:
    name: size-budget (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: scripts/size-budget.sh

  platform-truth-smoke:
    name: platform-truth-smoke (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p zeppelin-embed-bench --bin platform-truth -- --smoke

  ffi-sanitizers:
    name: ffi-${{ matrix.sanitizer }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
        sanitizer: [address, thread]
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      - name: ffi test suites under ${{ matrix.sanitizer }} sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=0
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
          ZE_CARGO_TEST_ARGS: -Zbuild-std --target ${{ matrix.target }}
        run: >-
          cargo +nightly test -Zbuild-std --target ${{ matrix.target }}
          -p zeppelin-embed-ffi --lib --test ffi_query --test ffi_contract
          --test ffi_adversarial --test ffi_ownership
      - name: ffi soak under ${{ matrix.sanitizer }} sanitizer
        if: matrix.sanitizer == 'address'
        env:
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
          ZE_FFI_SOAK_ITERATIONS: 2000
        run: >-
          cargo +nightly test -Zbuild-std --target ${{ matrix.target }}
          -p zeppelin-embed-ffi --test ffi_soak -- --ignored

  ffi-soak:
    name: ffi-soak (macos-14, 10k rounds)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p zeppelin-embed-ffi --test ffi_soak -- --ignored --nocapture

  ffi-loom:
    name: ffi-loom (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTFLAGS: --cfg loom
        run: cargo test -p zeppelin-embed-ffi --lib slots::loom_model

  fuzz-smoke:
    name: fuzz-smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: scripts/cargo-fuzz-nightly run fuzz_smoke --target x86_64-unknown-linux-gnu -- -max_total_time=60
      - run: scripts/cargo-fuzz-nightly run kernels_equivalence --target x86_64-unknown-linux-gnu -- -max_total_time=60
      - run: scripts/cargo-fuzz-nightly run segment_reader --target x86_64-unknown-linux-gnu -- -max_total_time=60
      - run: scripts/cargo-fuzz-nightly run graph_node_block_decode --target x86_64-unknown-linux-gnu -- -max_total_time=60
      - run: scripts/cargo-fuzz-nightly run manifest_decode --target x86_64-unknown-linux-gnu -- -max_total_time=60
      - run: scripts/cargo-fuzz-nightly run ffi_requests --target x86_64-unknown-linux-gnu -- -max_total_time=60

  address-sanitizer:
    name: address-sanitizer-corruption (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Run the complete persisted-artifact corruption matrix under ASan
        env:
          ASAN_OPTIONS: detect_leaks=1
          RUSTFLAGS: -Zsanitizer=address
        run: >-
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu
          -p zeppelin-embed --test corruption

  kernel-perf-floor:
    name: kernel-perf-floor (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo test --release -p zeppelin-embed --test kernels
          kernels::perf -- --ignored --nocapture

  miri:
    name: miri (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Check the core under Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test -p zeppelin-embed --lib
      - name: Check FFI marshaling under Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test -p zeppelin-embed-ffi --lib marshal
