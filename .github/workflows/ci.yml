name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy supported workspace targets
        run: >-
          cargo clippy --workspace --all-targets
          --features zeppelin-embed-workspace-tests/graph-result-test-support
          -- -D warnings
      - name: Clippy shipped graph library
        run: cargo clippy -p zeppelin-embed --features graph-cypher -- -D warnings

  doc:
    name: doc (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Document supported workspace targets
        run: >-
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
          --features zeppelin-embed-workspace-tests/graph-result-test-support

  test:
    name: test (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cbindgen@0.29.4
      - name: Test supported workspace targets
        run: >-
          cargo test --workspace --exclude zeppelin-embed-workspace-tests
          --features zeppelin-embed-ffi/graph-cypher
      - name: Exercise the scoped graph-result allocation hook
        run: >-
          cargo test -p zeppelin-embed-workspace-tests
          --features graph-result-test-support
          --test adversarial_tests
          property_graph_response_probe_checks_real_owners_and_paired_faults
          -- --exact
      - name: Exercise every runtime kernel arm
        run: PROPTEST_CASES=1024 cargo test -p zeppelin-embed kernels

  format-compat:
    name: format-compat (macos-14)
    runs-on: macos-14
    env:
      CARGO_BUILD_JOBS: "3"
      ZE_FORMAT_COMPAT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Populate the offline release-reader build cache
        run: cargo fetch --locked
      - run: cargo test -p zeppelin-embed --features graph-cypher --test format_compat
      - run: cargo test -p zeppelin-embed --features graph-cypher --test format_compat -- --ignored --skip a_relocated_0_6_0_namespace_store_is_refused_today

  swift-test:
    name: swift-test (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p zeppelin-embed-ffi --release
      - run: cd bindings/swift && ZE_USE_LOCAL_FFI=1 swift test

  deny:
    name: deny (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
      - name: Prove the deny policy rejects Tokio
        run: >-
          cargo test -p zeppelin-embed-workspace-tests
          --test scaffold_gates deny_blacklist_rejects_banned_dep
          -- --ignored --exact

  size-budget:
    name: size-budget (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Build explicit legacy and graph-cypher size artifacts
        env:
          CARGO_BUILD_JOBS: "3"
        run: |
          cargo build --locked --release -p zeppelin-embed -p zeppelin-embed-ffi --no-default-features --target-dir target/ze107/legacy
          MACOSX_DEPLOYMENT_TARGET=14.0 cargo build --locked --release -p zeppelin-embed-ffi --no-default-features --features graph-cypher --target-dir target/ze107/graph-cypher
          scripts/size-budget.sh --core-archive target/ze107/legacy/release/libzeppelin_embed.a
          scripts/size-budget.sh --ffi-archive target/ze107/legacy/release/libzeppelin_embed_ffi.a
          scripts/size-budget.sh --graph-archive target/ze107/graph-cypher/release/libzeppelin_embed_ffi.a
          python3 scripts/release/check-graph-artifact.py --legacy target/ze107/legacy/release/libzeppelin_embed_ffi.a --graph target/ze107/graph-cypher/release/libzeppelin_embed_ffi.a --output target/ze107/evidence

  platform-truth-smoke:
    name: platform-truth-smoke (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p zeppelin-embed-bench --bin platform-truth -- --smoke

  ffi-sanitizers:
    name: ffi-${{ matrix.sanitizer }} (macos-14)
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      - name: ffi test suites under ${{ matrix.sanitizer }} sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=0
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
          ZE_CARGO_TEST_ARGS: -Zbuild-std --target aarch64-apple-darwin
        run: >-
          cargo +nightly test -Zbuild-std --target aarch64-apple-darwin
          -p zeppelin-embed-ffi --lib --test ffi_query --test ffi_contract
          --test ffi_adversarial --test ffi_ownership
      - name: bounded graph binding suites under ${{ matrix.sanitizer }} sanitizer
        env:
          CARGO_BUILD_JOBS: 3
          ZE_TEST_SEED: 72
          ASAN_OPTIONS: detect_leaks=0
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
        run: >-
          cargo +nightly test -Zbuild-std --target aarch64-apple-darwin
          -p zeppelin-embed-ffi --features graph-bindings-test-support
          --test ffi_graph_full --test ffi_graph_ownership --test ffi_graph_poison
          -- --test-threads=1
      - name: ffi soak under ${{ matrix.sanitizer }} sanitizer
        if: matrix.sanitizer == 'address'
        env:
          ASAN_OPTIONS: detect_leaks=0:quarantine_size_mb=1:thread_local_quarantine_size_kb=64
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
          ZE_FFI_SOAK_ITERATIONS: 2000
        run: >-
          cargo +nightly test -Zbuild-std --target aarch64-apple-darwin
          -p zeppelin-embed-ffi --test ffi_soak -- --ignored

  ffi-soak:
    name: ffi-soak (macos-14, 10k rounds)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p zeppelin-embed-ffi --test ffi_soak -- --ignored --nocapture

  kernel-perf-floor:
    name: kernel-perf-floor (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo test --release -p zeppelin-embed --test kernels
          kernels::perf -- --ignored --nocapture
