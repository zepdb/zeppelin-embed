name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Python quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            native-library: libzeppelin_embed_ffi.dylib
          - os: ubuntu-latest
            native-library: libzeppelin_embed_ffi.so
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --editable './python[dev]'
      - run: cargo build --locked -p zeppelin-embed-ffi
      - name: Ruff
        working-directory: python
        run: ruff check .
      - name: Strict mypy
        working-directory: python
        run: mypy
      - name: Pytest core bindings
        working-directory: python
        env:
          ZEPPELIN_EMBED_LIBRARY: ${{ github.workspace }}/target/debug/${{ matrix.native-library }}
        run: pytest tests --ignore=tests/test_text_api.py

  wheels:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - uses: pypa/cibuildwheel@v4.1.1
        with:
          package-dir: python
          output-dir: wheelhouse
      - name: Verify wheel in a fresh environment
        run: python python/tests/verify_wheel.py wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: zeppelin-embed-${{ runner.os }}-${{ runner.arch }}
          path: wheelhouse/*.whl
