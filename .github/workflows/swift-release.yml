name: Swift Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to package, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-xcframework:
    name: Build universal macOS XCFramework
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Match release tag to package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          workspace = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          version = workspace["workspace"]["package"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} must be {expected!r}")
          manifest = pathlib.Path("Package.swift").read_text()
          expected_url = f"/releases/download/{expected}/ZeppelinEmbed.xcframework.zip"
          if expected_url not in manifest:
              raise SystemExit(f"Package.swift must contain {expected_url!r}")
          PY
      - name: Build XCFramework
        run: scripts/xcframework/build.sh
      - name: Build language-neutral macOS SDK
        run: scripts/macos-sdk/build.sh
      - name: Verify Swift package against built XCFramework
        env:
          ZE_USE_LOCAL_XCFRAMEWORK: "1"
        run: swift test --scratch-path target/swift-xcframework-smoke
      - name: Verify archive checksum
        run: |
          expected="$(grep -o '"[0-9a-f]\{64\}" // ze:xcframework-checksum' Package.swift | cut -d'"' -f2)"
          test -n "$expected"
          actual="$(swift package compute-checksum target/xcframework/ZeppelinEmbed.xcframework.zip)"
          if [ "$actual" != "$expected" ]; then
              # CI is the source of truth for this value (BL-167). Print it so
              # the pin can be applied in one round trip instead of guessed.
              echo "Package.swift pins $expected but CI built $actual" >&2
              echo "Pin this in Package.swift: $actual" >&2
              exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zeppelin-embed-macos-artifacts
          path: |
            target/xcframework/ZeppelinEmbed.xcframework.zip
            target/macos-sdk/zeppelin-embed-macos-arm64.tar.gz
          if-no-files-found: error

  attach-release:
    name: Attach macOS artifacts to GitHub release
    needs: build-xcframework
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zeppelin-embed-macos-artifacts
          path: dist
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          gh release upload "$RELEASE_TAG"
          dist/xcframework/ZeppelinEmbed.xcframework.zip
          dist/macos-sdk/zeppelin-embed-macos-arm64.tar.gz
          --clobber
          --repo "$GITHUB_REPOSITORY"
