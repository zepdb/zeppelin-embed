name: Swift Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to package, for example v0.1.0
        required: true
        type: string
      source_ref:
        description: Optional branch or SHA for checksum rehearsal; never attaches release assets
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-xcframework:
    name: Build universal macOS XCFramework
    runs-on: macos-14
    env:
      CARGO_BUILD_JOBS: "3"
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: legacy
            suffix: ""
            name: ZeppelinEmbed
          - artifact: graph-cypher
            suffix: -graph-cypher
            name: ZeppelinEmbedGraph
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: llvm-tools-preview
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install pinned nightly for -Z build-std
        # scripts/xcframework/build.sh invokes this exact toolchain by name
        # (cargo +nightly-2026-07-01) for one step only: producing the
        # release static library with -Z build-std. Installed alongside,
        # not as the rustup default, so every other step in this job (the
        # macOS SDK build, the Swift package test) keeps using the stable
        # 1.93.0 toolchain set up above.
        run: |
          rustup toolchain install nightly-2026-07-01 --profile minimal \
            --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup component add rust-src --toolchain nightly-2026-07-01
      - uses: Swatinem/rust-cache@v2
      - name: Match release tag to package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          workspace = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          version = workspace["workspace"]["package"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} must be {expected!r}")
          graph = "${{ matrix.artifact }}" == "graph-cypher"
          manifest_path = "Package.swift"
          manifest = pathlib.Path(manifest_path).read_text()
          name = "ZeppelinEmbedGraph" if graph else "ZeppelinEmbed"
          expected_url = f"/releases/download/{expected}/{name}.xcframework.zip"
          if expected_url not in manifest:
              raise SystemExit(f"{manifest_path} must contain {expected_url!r}")
          PY
      - name: Build XCFramework
        run: scripts/xcframework/build.sh --artifact ${{ matrix.artifact }}
      - name: Report separate graph core sections
        if: matrix.artifact == 'graph-cypher'
        run: |
          cores=(target/xcframework-graph-cypher/cargo/aarch64-apple-darwin/release/deps/libzeppelin_embed-*.a)
          test "${#cores[@]}" -eq 1
          scripts/size-budget.sh --graph-core-archive "${cores[0]}"
      - name: Build language-neutral macOS SDK
        run: scripts/macos-sdk/build.sh --artifact ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: zeppelin-embed-macos-${{ matrix.artifact }}
          path: |
            target/xcframework${{ matrix.suffix }}/${{ matrix.name }}.xcframework.zip
            target/macos-sdk${{ matrix.suffix }}/zeppelin-embed${{ matrix.suffix }}-macos-arm64.tar.gz
          if-no-files-found: error
      - name: Verify archive checksum
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("installed", "scripts/release/check-installed-graph.py")
          checker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(checker)
          graph = "${{ matrix.artifact }}" == "graph-cypher"
          if graph:
              checker.check_release_contract(
                  archive=Path("target/xcframework-graph-cypher/ZeppelinEmbedGraph.xcframework.zip"),
                  enforce_checksum=True)
          else:
              import hashlib
              expected = checker.pin(Path("Package.swift").read_text())
              actual = hashlib.sha256(Path("target/xcframework/ZeppelinEmbed.xcframework.zip").read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"legacy checksum mismatch: pinned={expected} actual={actual}")
          PY

  qualify-installed:
    name: Qualify exact uploaded distributions
    needs: build-xcframework
    runs-on: macos-14
    env:
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: llvm-tools-preview
      - uses: actions/download-artifact@v4
        with:
          pattern: zeppelin-embed-macos-*
          merge-multiple: true
          path: dist
      - name: Build graph profile consumer
        run: cargo build --locked -p zeppelin-embed-workspace-tests --features graph-cypher --bin graph-profile
      - name: Installed C and typed Swift execution
        run: |
          sw_vers
          uname -a
          python3 scripts/release/check-installed-graph.py --artifact-root dist --enforce-checksum --output tasks/evidence/ze-71-installed
      - uses: actions/upload-artifact@v4
        with:
          name: ze-71-installed-evidence
          path: tasks/evidence/ze-71-installed
          if-no-files-found: error

  attach-release:
    name: Attach macOS artifacts to GitHub release
    needs: qualify-installed
    if: inputs.source_ref == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zeppelin-embed-macos-*
          merge-multiple: true
          path: dist
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          gh release upload "$RELEASE_TAG"
          dist/xcframework/ZeppelinEmbed.xcframework.zip
          dist/macos-sdk/zeppelin-embed-macos-arm64.tar.gz
          dist/xcframework-graph-cypher/ZeppelinEmbedGraph.xcframework.zip
          dist/macos-sdk-graph-cypher/zeppelin-embed-graph-cypher-macos-arm64.tar.gz
          --clobber
          --repo "$GITHUB_REPOSITORY"
