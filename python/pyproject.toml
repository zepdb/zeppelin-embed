[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zeppelin-embed"
version = "0.1.0"
description = "ctypes bindings for the Zeppelin Embed C ABI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["zeppelin_embed*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
files = ["zeppelin_embed"]

[tool.cibuildwheel]
build = "cp311-*"
build-verbosity = 1
skip = "*-musllinux_*"
test-command = "python -I tests/installed_smoke.py"
test-sources = ["tests/installed_smoke.py"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.93.0"
environment = { PATH = "$HOME/.cargo/bin:$PATH", RUSTUP_TOOLCHAIN = "1.93.0" }
manylinux-x86_64-image = "manylinux2014"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
