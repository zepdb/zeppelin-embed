[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeppelin-embed"
version = "0.1.0"
description = "ctypes bindings for the Zeppelin Embed C ABI"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["zeppelin_embed*"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["zeppelin_embed"]
